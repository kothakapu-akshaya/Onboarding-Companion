include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

default:
  interruptible: true
  tags:
    - admin

stages:
  - validate
  - format
  - lint
  - type-check
  - test
  - security

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key:
    files:
      - uv.lock
  policy: pull
  paths:
    - .cache/uv

.setup_uv: &setup_uv
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen

validate:
  <<: *setup_uv
  stage: validate
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen --extra devdependencies
  script:
    - uv run pre-commit run check-merge-conflict --all-files
    - uv run pre-commit run check-json --all-files
    - uv run pre-commit run check-toml --all-files
    - uv run pre-commit run check-added-large-files --all-files

ruff-lint:
  <<: *setup_uv
  stage: lint
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen --extra devdependencies
  script:
    - uv run ruff check . --exclude tests,alembic,docs
  only:
    changes:
      - "**/*.py"

bandit:
  <<: *setup_uv
  stage: security
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen --extra devdependencies
  script:
    - uv run bandit -r app/ -c pyproject.toml --exclude tests,alembic,docs
  only:
    changes:
      - "**/*.py"

ruff-format:
  <<: *setup_uv
  stage: format
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen --extra devdependencies
  script:
    - uv run ruff format --check . --exclude tests,alembic,docs
  only:
    changes:
      - "**/*.py"

type-check:
  <<: *setup_uv
  stage: type-check
  script:
    - uv run pyrefly check . --project-excludes "tests/**" "alembic/**" "docs/**"
  only:
    changes:
      - "**/*.py"

pytest:
  <<: *setup_uv
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git libmagic1
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen --extra devdependencies
  script:
    - uv run pytest -v --cov=. -n auto --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    changes:
      - "**/*.py"

pyupgrade:
  <<: *setup_uv
  stage: lint
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen --extra devdependencies
  script:
    - uv run pyupgrade --py313-plus --exit-zero-even-if-changed $(find app -name "*.py" ! -path "*/tests/*" ! -path "*/alembic/*" ! -path "*/docs/*")
  only:
    changes:
      - "**/*.py"
