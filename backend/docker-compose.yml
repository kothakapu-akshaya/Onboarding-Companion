services:
  # Redis for Celery broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - DB_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Add restart policy to ensure persistence
    restart: unless-stopped

  # Database initialization service
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run python init_db.py
    restart: "no" # Run once and exit
    volumes:
      - ./scripts:/app/scripts:ro
    # Add healthcheck to track initialization completion
    healthcheck:
      test: ["CMD", "echo", "Database initialization completed"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 30s

  # Main FastAPI application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./app:/app/app:ro # Mount app code for development
      - ./scripts:/app/scripts:ro # Mount scripts for development commands
      - ${TEMP_DIR:-/tmp}:/tmp # Temporary file storage
    command: uv run gunicorn -k uvicorn.workers.UvicornWorker app.main:app -w 2 -b 0.0.0.0:8000 --reload --timeout 300 --keep-alive 10 --max-requests 2000 --max-requests-jitter 50 --preload --worker-connections 1000 --limit-request-line 8190 --limit-request-field_size 8190
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  # Celery worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./app:/app/app:ro # Mount app code for development
      - ./scripts:/app/scripts:ro # Mount scripts for development commands
      - ${TEMP_DIR:-/tmp}:/tmp # Temporary file storage
    command: uv run celery -A app.core.celery_app worker --loglevel=info --queues=default,file_processing,notifications,data_analysis
    healthcheck:
      test: ["CMD", "uv", "run", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker for high-priority tasks
  celery-worker-priority:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ${TEMP_DIR:-/tmp}:/tmp
    command: uv run celery -A app.core.celery_app worker --loglevel=info --queues=notifications,maintenance --concurrency=2

  # Celery beat scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    command: uv run celery -A app.core.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler

  # Flower for monitoring Celery (optional)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: uv run celery -A app.core.celery_app flower --port=5555
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:8.7
    profiles: ["local", "development"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default

  # MinIO for object storage
  minio:
    image: minio/minio
    profiles: ["local", "development"]
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${HZ_OBJ_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${HZ_OBJ_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - default

  # MinIO bucket initialization
  minio-init:
    image: minio/mc
    profiles: ["local", "development"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${HZ_OBJ_ACCESS_KEY} ${HZ_OBJ_SECRET_KEY} &&
      mc mb --ignore-existing local/${MINIO_DEFAULT_BUCKETS} &&
      echo 'Bucket ${MINIO_DEFAULT_BUCKETS} ensured.'
      "
    restart: "no"

volumes:
  DB_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: corpus-te-network
